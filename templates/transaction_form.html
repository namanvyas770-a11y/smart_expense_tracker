{% extends "base.html" %}
{% block title %}{{ heading }} · SpendWise{% endblock %}
{% block content %}
<div class="form-shell"><div class="mb-4"><p class="eyebrow mb-1">TRANSACTION DETAILS</p><h1 class="page-title mb-1">{{ heading }}</h1><p class="text-secondary mb-0">Keep the details accurate so your reports stay useful.</p></div>
<form method="post" class="panel form-panel">
  <div class="mb-3"><label class="form-label" for="title">Title</label><input class="form-control" id="title" name="title" maxlength="120" required value="{{ item.title if item else '' }}" placeholder="e.g. Lunch with friends"></div>
  <div class="row g-3"><div class="col-12 col-md-6"><label class="form-label" for="amount">Amount (₹)</label><input class="form-control" id="amount" name="amount" type="number" min="0.01" step="0.01" required value="{{ item.amount if item else '' }}" placeholder="250.00"></div>
  <div class="col-12 col-md-6"><label class="form-label" for="type">Type</label><select class="form-select" id="type" name="type"><option value="expense" {% if not item or item.type=='expense' %}selected{% endif %}>Expense</option><option value="income" {% if item and item.type=='income' %}selected{% endif %}>Income</option></select></div>
  <div class="col-12 col-md-6"><label class="form-label" for="category">Category</label><select class="form-select" id="category" name="category">{% for category in categories %}<option value="{{ category }}" {% if item and item.category==category %}selected{% elif not item and category=='Food' %}selected{% endif %}>{{ category }}</option>{% endfor %}</select></div>
  <div class="col-12 col-md-6"><label class="form-label" for="transaction_date">Date</label><input class="form-control" id="transaction_date" name="transaction_date" type="date" required value="{{ item.transaction_date if item else today }}"></div></div>
  <div class="mt-3 mb-4"><label class="form-label" for="notes">Notes (optional)</label><textarea class="form-control" id="notes" name="notes" maxlength="500" rows="3" placeholder="Add a short note">{{ item.notes if item and item.notes else '' }}</textarea></div>
  <div class="d-flex gap-2"><button class="btn btn-primary">{{ 'Save changes' if item else 'Add transaction' }}</button><a class="btn btn-outline-secondary" href="{{ url_for('transactions') }}">Cancel</a></div>
</form></div>
{% endblock %}
